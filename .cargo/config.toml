# FFmpeg discovery is split by target because the two platforms need entirely
# different artifacts.

# Windows: link the repo-local shared build under third_party/ffmpeg, populated
# by scripts/fetch-ffmpeg.ps1. ac-ffmpeg supports FFmpeg v4-v7 only -- do not
# point this at an FFmpeg 8/9 install.
#
# `force = true` is required, not cosmetic: a stale machine-wide
# FFMPEG_INCLUDE_DIR / FFMPEG_LIB_DIR (e.g. one pointing at a `lib/x64` that
# does not exist) otherwise takes precedence and the build fails to find the
# headers or the import libraries.
[target.x86_64-pc-windows-msvc.env]
FFMPEG_INCLUDE_DIR = { value = "third_party/ffmpeg/include", relative = true, force = true }
FFMPEG_LIB_DIR = { value = "third_party/ffmpeg/lib", relative = true, force = true }

# Linux/macOS: ac-ffmpeg-build probes pkg-config for libavcodec, so the system
# FFmpeg is used as-is. Deliberately no PKG_CONFIG_PATH override here: the
# shared build in third_party/ffmpeg is a *Windows* package, and putting its
# .pc files on the search path would hand a Linux build Windows include and
# library directories.
