# coturn: STUN/TURN for viewers that cannot reach the sharer directly.
#
# Only needed for viewers outside the LAN. With no TURN server the sharer still
# works for anyone on the same network, because WebRTC uses host candidates.
#
# Fill in `external-ip`, `realm`/`server-name` and the `user` password below,
# then run it with deploy/docker-compose.yml.
#
# Docs: https://github.com/coturn/coturn/wiki/turnserver

listening-port=3478

# Serve TURN over TLS as well once you have a certificate. Some restrictive
# networks only allow 443/5349.
# tls-listening-port=5349

# Public address of this host, so coturn advertises candidates a viewer can
# actually reach. Required when the host is behind NAT or has several
# addresses.
external-ip=203.0.113.10

realm=stream.example.com
server-name=stream.example.com

fingerprint

# Long-term credentials. `user` must match the username/credential pair the
# sharer puts in its [[ice_servers]] block in config.toml.
lt-cred-mech
user=mira:change-me-too

# Relay port range. Open this range in the firewall as well (UDP).
min-port=49152
max-port=65535

no-multicast-peers

# Deliberately NOT denying the private ranges here. coturn's own sample config
# blocks 10/8, 172.16/12 and 192.168/16 to stop a public relay being abused to
# reach internal networks -- but this is a self-hosted relay for your own
# viewers, some of whom are on the same LAN, so those denials would break
# exactly the traffic you want. If you expose this relay to the public
# internet, re-add them and rely on the sharer's own host candidates for LAN
# viewers.

log-file=stdout
simple-log
