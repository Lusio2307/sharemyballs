# NVIDIA NVENC hardware encoding.
#
# Session, [webui] and [[ice_servers]] settings live in config.toml; copy the
# [encoder] block below into it. See ../config.toml.example for the rest.
#
# Requires an NVIDIA GPU and an FFmpeg build with h264_nvenc (the BtbN
# win64-gpl-shared package used by scripts/fetch-ffmpeg.ps1 has it).
#
# NOTE: this preset used to list `tune` twice and pass `zerolatency`, which is
# an x264/x265 option that h264_nvenc does not define. Duplicate keys make the
# file invalid TOML outright, and an unknown option makes avcodec_open2 fail,
# so the encoder could never be created. `tune = "ll"` is the NVENC equivalent.

max_fps = 60

[encoder]
encoder = "h264_nvenc"
pixel_format = "bgra"
encoding = "video/H264"

[encoder.options]
# p1 = fastest .. p7 = slowest/highest quality. Live streaming wants the fast
# end; p4 is a reasonable middle ground.
preset = "p4"
# "ll" = low latency (no lookahead, no B-frames).
tune = "ll"
profile = "baseline"
forced-idr = "true"
