# VP9 via libvpx -- lower bandwidth than H.264 for screen content, at higher
# CPU cost and with weaker hardware-decode support in browsers.
#
# Session, [webui] and [[ice_servers]] settings live in config.toml; copy the
# [encoder] block below into it. See ../config.toml.example for the rest.
#
# NOTE: this preset used to list `max-intra-rate` twice, which makes the file
# invalid TOML (the toml crate rejects duplicate keys) and prevented it from
# loading at all.

max_fps = 30

[encoder]
encoder = "libvpx-vp9"
pixel_format = "yuv420p"
encoding = "video/VP9"

# https://developers.google.com/media/vp9/live-encoding
[encoder.options]
deadline = "realtime"
tune-content = "screen"
max-intra-rate = "300"
tile-columns = "4"
speed = "6"
frame-parallel = "1"
threads = "8"
static-thresh = "0"
quality = "realtime"
lag-in-frames = "0"
qmin = "4"
qmax = "48"
row-mt = "1"
