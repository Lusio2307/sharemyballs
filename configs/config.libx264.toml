# Software x264 for macOS/Linux (yuv420p input, as those capture backends
# produce). On Windows use config.libx264.win.toml instead.
#
# Session, [webui] and [[ice_servers]] settings live in config.toml; copy the
# [encoder] block below into it. See ../config.toml.example for the rest.

max_fps = 60

[encoder]
encoder = "libx264"
pixel_format = "yuv420p"
encoding = "video/H264"

[encoder.options]
profile = "baseline"
tune = "zerolatency"
preset = "ultrafast"
forced-idr = "true"
